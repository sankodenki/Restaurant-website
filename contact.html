<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせ</title>
  <link rel="stylesheet" href="html5reset-1.6.1.css">
  <link rel="stylesheet" href="contact.css">
</head>
<body>
<main class="wrapper">
  <div id="form-contents">
    <h1>レストランに関するお問い合わせ</h1>
    <form action="#" method="post">
      <dl>
        <dt><label for="username">お名前</label></dt>
        <dd>
          <input id="username" type="text" name="username" placeholder="（例）山田 太郎" autocomplete="name">
        </dd>
        <dt><label for="kana">フリガナ</label></dt>
        <dd>
          <input id="kana" type="text" name="kana" placeholder="（例）ヤマダ タロウ" autocomplete="additional-name">
        </dd>
        <dt>
          <fieldset> 
            <legend>性別</legend>
          </fieldset>
        </dt>
        <dd id="gender">
          <input id="male" type="radio" name="gender" value="male" checked>
          <label for="male">男性</label>
          <input id="female" type="radio" name="gender" value="female">
          <label for="female">女性</label>
        </dd>
        <dt>
          <fieldset> 
            <legend>電話番号</legend>
          </fieldset>
        </dt>
        <dd>
          <ul>
            <li class="tel1">
            <input id="tell" class="inputText" type="text" name="tel1" maxlength="6">
            </li>
            <li class="bar">-</li>
            <li class="tel2">
            <input id="tel2" class="inputText" type="text" name="tel2" maxlength="4">
            </li>
            <li class="bar">-</li>
            <li class="tel3">
            <input id="tel3" class="inputText" type="text" name="tel3" maxlength="5">
            </li>
          </ul>
          <p>*半角数字でご入力ください。</p>
        </dd>
        <dt><label for="e-mail">メールアドレス</label></dt>
        <dd>
          <input id="e-mail" type="email" name="e-mail" autocomplete="email">
        </dd>
        <dt><label for="contents">お問い合わせ内容</label></dt>
        <dd>
          <textarea id="contents" name="contents"></textarea>
        </dd>
        <dt><label for="privacy">プライバシーポリシーに同意する</label></dt>
        <dd>
          <input id="privacy" type="checkbox" name="privacy" value="1">
        </dd>
      </dl>
        <input id="submit" type="submit" value="送信する">
    </form>
  </div>
</main>

</body>
</html>
